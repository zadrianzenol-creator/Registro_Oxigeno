<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6e4f"/>
      <stop offset="100%" stop-color="#22c39a"/>
    </linearGradient>
    <linearGradient id="tanque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eafaf4"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#fondo)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- onda de flujo -->
  <path d="M12 74 Q22 64 32 74 T52 74 T72 74 T88 74" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- tanque de oxigeno -->
  <rect x="40" y="30" width="20" height="44" rx="9" fill="url(#tanque)"/>
  <rect x="45.5" y="21" width="9" height="10" rx="2.5" fill="url(#tanque)"/>
  <circle cx="50" cy="18" r="3" fill="url(#tanque)"/>
  <rect x="40" y="42" width="20" height="4" fill="#0b6e4f" opacity="0.12"/>

  <!-- cruz medica -->
  <rect x="46.5" y="50" width="7" height="18" rx="2" fill="#0b6e4f"/>
  <rect x="41" y="55.5" width="18" height="7" rx="2" fill="#0b6e4f"/>
</svg>
